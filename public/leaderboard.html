<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Classement - Mots En Croix Chrétiens</title>
    <meta name="description" content="Records locaux du jeu de mots croisés chrétiens par Emmanuel Payet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/leaderboard.css">
</head>
<body>
    <div class="page-header">
        <h1>🏆 Records sur cet appareil</h1>
        <p>Les meilleurs joueurs de Mots En Croix Chrétiens</p>
        <a href="../index.html" class="back-button">← Retour au jeu</a>
    </div>

    <div class="leaderboard-container">
        <div id="leaderboard"></div>
        <button id="refreshButton" class="refresh-button">🔄 Actualiser le classement</button>
    </div>

    <footer>
        <p>Créé avec ❤️ par <a href="https://emmanuel.gallery/" target="_blank">Emmanuel Payet</a></p>
        <p style="margin-top: 10px; font-size: 0.9em;">Christian Author • Digital Artist • Spiritual Composer</p>
    </footer>

    <!-- Module Leaderboard -->
    <script src="../js/leaderboard.js"></script>

    <script>
        const initLeaderboard = async () => {
            await leaderboardManager.displayLeaderboard('leaderboard', {
                limit: 20,           // Top 20 joueurs
                showArtist: true,    // Afficher info artiste
                showStats: true,     // Afficher stats
                forceRefresh: false  // Utiliser cache si disponible
            });

            // Bouton refresh
            const refreshBtn = document.getElementById('refreshButton');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', async () => {
                    refreshBtn.disabled = true;
                    refreshBtn.textContent = '⏳ Actualisation...';
                    
                    await leaderboardManager.displayLeaderboard('leaderboard', {
                        limit: 20,
                        showArtist: true,
                        showStats: true,
                        forceRefresh: true  // Forcer le rechargement depuis DB
                    });
                    
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = '🔄 Actualiser le classement';
                });
            }
        };

        // Charger le leaderboard au démarrage
        document.addEventListener('DOMContentLoaded', initLeaderboard);
    </script>
</body>
</html>
